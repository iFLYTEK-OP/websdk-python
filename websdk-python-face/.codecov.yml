# Codecov 配置文件
# 文档: https://docs.codecov.com/docs/codecov-yaml

# 覆盖率精度和范围
coverage:
  precision: 2
  round: down
  range: "60...100"
  
  # 状态检查
  status:
    # 项目整体覆盖率
    project:
      default:
        target: 80%          # 目标覆盖率
        threshold: 1%        # 允许下降的阈值
        base: auto           # 与之前的提交比较
        if_ci_failed: error
    
    # 补丁覆盖率（新增代码）
    patch:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: error

# 评论设置
comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# 忽略的文件和目录
ignore:
  - "tests/"
  - "**/*_test.py"
  - "**/test_*.py"
  - "setup.py"
  - "example/"
  - "build/"
  - "dist/"
  - "*.egg-info"

# 标志配置
flags:
  face-module:
    paths:
      - xfyunsdkface/
    carryforward: true

# GitHub Checks
github_checks:
  annotations: true

